app-id: com.github.dimkr.gplaces
runtime: org.freedesktop.Platform
runtime-version: '25.08'
sdk: org.freedesktop.Sdk
rename-icon: gplaces
rename-desktop-file: gplaces.desktop
command: gplaces
modules:
  - name: gplaces
    buildsystem: simple
    build-commands:
      - make PREFIX=/app CONFDIR=/app/etc WITH_FLATPAK_SPAWN=1 install
    sources:
      - type: git
        url: https://github.com/dimkr/gplaces
        tag: v0.20.3
        commit: a5a789e2e76e8a83bd4edcdf52a0fe4b770cc5fe
finish-args:
  - --share=network
  - --filesystem=xdg-download
  - --talk-name=org.freedesktop.Flatpak
